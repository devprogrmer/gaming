# Bundled provider seed data for discovery.
#
# A curated, maintainable snapshot mapping well-known datacenter / hosting /
# cloud / CDN providers to representative CIDRs, tagged with the storage
# category they belong to. This gives the discovery flow broad, deterministic
# coverage offline (and augments live discovery), so a "discover" pass can
# aggregate MANY real ranges across many providers rather than a handful of
# samples. It is intentionally not an exhaustive real-time BGP dump — live
# discovery still adds to it.
#
# category is one of: foreign_cdn, foreign_datacenter, iran_cdn, iran_datacenter
# country is the ISO-3166 alpha-2 code (best-effort; IR for Iranian networks).

