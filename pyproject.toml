[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming"
dynamic = ["version"]
description = "Network discovery and reachability analysis CLI tool (NOT a video game)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gaming maintainers" }]
keywords = [
    "network",
    "discovery",
    "rdap",
    "whois",
    "asn",
    "bgp",
    "peeringdb",
    "reachability",
    "cli",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/devprogrmer/gaming"
Repository = "https://github.com/devprogrmer/gaming"
Issues = "https://github.com/devprogrmer/gaming/issues"
Changelog = "https://github.com/devprogrmer/gaming/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
gaming = "gaming.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gaming.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaming = ["py.typed"]
"gaming.interactive.data" = ["*.txt", "*.toml"]
"gaming.web.static" = ["*.html", "*.css", "*.js", "*.svg", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["gaming"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
